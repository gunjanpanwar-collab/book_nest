services:
  # Backend (FastAPI + Gemini)
  - type: web
    name: booknest-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3

  # Frontend (static site)
  - type: web
    name: booknest
    runtime: static
    staticPublishPath: .
